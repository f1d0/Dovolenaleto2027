<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Léto 2027 — výběr ubytování pro 7 rodin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>

:root{
  --snow:#F5F7F7; --paper:#FFFFFF; --ink:#16211F; --ink-soft:#4A5A57;
  --granite:#7C8C89; --line:#DFE6E4;
  --spruce:#1F5347; --spruce-soft:#E4EEEA;
  --rowan:#B0472F; --rowan-soft:#F7E6E1;
  --gold:#7A5C18; --gold-soft:#F6EEDA;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --snow:#0F1614; --paper:#18211F; --ink:#E2EAE7; --ink-soft:#A7B8B4;
    --granite:#849793; --line:#2A3634;
    --spruce:#6FB39F; --spruce-soft:#1B2E29;
    --rowan:#E0846A; --rowan-soft:#2E211D;
    --gold:#D8B45E; --gold-soft:#2B2415;
  }
}
:root[data-theme="dark"]{
  --snow:#0F1614; --paper:#18211F; --ink:#E2EAE7; --ink-soft:#A7B8B4;
  --granite:#849793; --line:#2A3634;
  --spruce:#6FB39F; --spruce-soft:#1B2E29;
  --rowan:#E0846A; --rowan-soft:#2E211D;
  --gold:#D8B45E; --gold-soft:#2B2415;
}
:root[data-theme="light"]{
  --snow:#F5F7F7; --paper:#FFFFFF; --ink:#16211F; --ink-soft:#4A5A57;
  --granite:#7C8C89; --line:#DFE6E4;
  --spruce:#1F5347; --spruce-soft:#E4EEEA;
  --rowan:#B0472F; --rowan-soft:#F7E6E1;
  --gold:#7A5C18; --gold-soft:#F6EEDA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 72px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.15;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--ink-soft);max-width:64ch;margin:0 0 8px}
.stamp{font-family:var(--mono);font-size:.74rem;color:var(--granite)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:26px 0}
.tile-num{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.tile-num b{display:block;font-family:var(--mono);font-size:1.6rem;overflow-wrap:anywhere;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--spruce)}
.tile-num span{font-size:.78rem;color:var(--ink-soft)}
.controls{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:13px}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl-lab{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--granite);min-width:78px;font-weight:700}
.chip{font:inherit;font-size:.83rem;padding:5px 11px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:2px;cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--spruce);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--snow)}
select{font:inherit;font-size:.83rem;padding:5px 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px}
.chip:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
.count{font-family:var(--mono);font-size:.78rem;color:var(--granite);margin:0 0 18px}
.card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--granite);border-radius:3px;padding:18px 20px;margin-bottom:12px}
.card.b-no{border-left-color:var(--spruce)}
.card.b-yes{border-left-color:var(--rowan)}
.chead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.cname{font-family:var(--serif);font-size:1.2rem;font-weight:600;margin:0}
.cvill{font-size:.85rem;color:var(--ink-soft)}
.rate{font-family:var(--mono);font-size:.95rem;color:var(--spruce);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate small{color:var(--granite);font-weight:400}
.stats{display:flex;flex-wrap:wrap;margin:14px 0 12px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.stat{flex:1 1 86px;padding:8px 10px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.67rem;text-transform:uppercase;letter-spacing:.05em;color:var(--granite)}
.stat.warn b{color:var(--rowan)}
.stat.good b{color:var(--spruce)}
.verdict{font-size:.85rem;color:var(--ink);background:var(--spruce-soft);border-left:3px solid var(--spruce);
  border-radius:2px;padding:9px 12px;margin:0 0 11px}
.verdict b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--spruce);margin-bottom:3px}
.found{font-size:.78rem;color:var(--gold);background:var(--gold-soft);border-radius:2px;
  padding:5px 10px;margin:0 0 10px;display:inline-block;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 11px}
.ck{font-size:.71rem;padding:2px 8px 2px 6px;border-radius:2px;border:1px solid var(--line);
  color:var(--granite);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.ck b{font-family:var(--mono);font-size:.8rem;line-height:1}
.ck-yes{color:var(--spruce);border-color:var(--spruce-soft);background:var(--spruce-soft)}
.ck-no{color:var(--rowan);border-color:var(--rowan-soft);background:var(--rowan-soft)}
.ck-un{opacity:.75}
.ck-sum{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  color:var(--spruce);margin-right:3px;white-space:nowrap}
.ck-sum.bad{color:var(--rowan)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:.74rem;padding:3px 9px;border-radius:2px;background:var(--spruce-soft);color:var(--spruce);font-weight:700}
.pill.warn{background:var(--rowan-soft);color:var(--rowan)}
.pill.note{background:var(--gold-soft);color:var(--gold)}
.pill.neutral{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:400}
.amen{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.amen span{font-size:.72rem;color:var(--ink-soft);border:1px solid var(--line);padding:2px 7px;border-radius:2px}
.price{font-family:var(--mono);font-size:.88rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.price em{font-style:normal;color:var(--granite);font-size:.78rem}
details{margin:8px 0 12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:.8rem;color:var(--spruce);font-weight:600}
.det{font-size:.84rem;color:var(--ink-soft);margin:8px 0 0}
.det dt{font-weight:700;color:var(--ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.det dd{margin:2px 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.8rem;color:var(--spruce);text-decoration:none;border:1px solid var(--spruce);padding:5px 11px;border-radius:2px;transition:.14s}
.links a:hover{background:var(--spruce);color:var(--snow)}
.empty{padding:40px;text-align:center;color:var(--granite);border:1px dashed var(--line);border-radius:3px}
.method{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin:0 0 22px}
.method>h2{font-family:var(--serif);font-size:1.1rem;margin:0 0 6px;color:var(--ink)}
.method>p{color:var(--ink-soft);font-size:.88rem;margin:0 0 14px;max-width:72ch}
.method details{border-top:1px solid var(--line);margin:0;padding-top:9px}
.method summary{cursor:pointer;font-weight:700;font-size:.88rem;padding:4px 0;color:var(--ink)}
.method details>p{font-size:.85rem;color:var(--ink-soft);margin:6px 0 0;max-width:72ch}
.method ul{margin:8px 0 4px;padding-left:20px;font-size:.85rem;color:var(--ink-soft)}
.method li{margin-bottom:7px}
.method code{font-family:var(--mono);font-size:.85em;background:var(--snow);padding:1px 4px;border-radius:2px}
/* Wide tables scroll inside their own box rather than pushing the page sideways. */
.mwrap{overflow-x:auto;margin:8px 0 2px}
.mtab{width:100%;border-collapse:collapse;font-size:.82rem;min-width:520px}
.mtab th{text-align:left;font-size:.67rem;text-transform:uppercase;letter-spacing:.06em;color:var(--granite);
  border-bottom:1px solid var(--line);padding:6px 14px 6px 0;font-weight:700;white-space:nowrap}
.mtab td{border-bottom:1px solid var(--line);padding:8px 14px 8px 0;vertical-align:top;color:var(--ink-soft)}
.mtab td:first-child{color:var(--ink);font-weight:600}
.mtab .num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.mtab tr:last-child td{border-bottom:0}
.mtab tr.sum td{font-weight:700;color:var(--ink);border-top:1px solid var(--line)}
footer{margin-top:46px;padding-top:22px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-soft)}
footer h2{font-family:var(--serif);font-size:1.05rem;margin:22px 0 6px;color:var(--ink)}
footer ul{margin:6px 0;padding-left:20px}
footer li{margin:3px 0}
footer a{color:var(--spruce)}
code{font-family:var(--mono);font-size:.78rem;background:var(--spruce-soft);color:var(--spruce);padding:1px 5px;border-radius:2px}
@media (max-width:560px){.wrap{padding:22px 14px 56px}.ctl-lab{min-width:100%}.stat{flex:1 1 72px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:3px;margin:26px 0 10px;overflow:hidden}
.maphead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.maphead h2{font-family:var(--serif);font-size:1.05rem;margin:0;font-weight:600}
.maptools{display:flex;flex-wrap:wrap;gap:6px}
.mapwrap{position:relative;background:var(--snow)}
svg.map{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}
svg.map.drag{cursor:grabbing}
.rd{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.rd1{stroke-width:2.6}.rd2{stroke-width:2}.rd3{stroke-width:1.3}.rd4{stroke-width:.8;opacity:.7}
.rv{fill:none;stroke:#7FA8C4;stroke-width:1.1;opacity:.55;stroke-linecap:round}
.lf{fill:none;stroke:var(--granite);stroke-width:.9;stroke-dasharray:3 2.5;opacity:.75}
.bl{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.stp{fill:var(--paper);stroke:var(--ink-soft);stroke-width:1.1}
.lift-m{fill:var(--granite)}
.lift-m.sr{fill:var(--spruce)}
.lift-m.sp{fill:#2B6BA8}
.plabel{font-family:var(--sans);font-size:8.5px;fill:var(--granite);letter-spacing:.03em;text-transform:uppercase;pointer-events:none}
.pin{cursor:pointer}
.pin circle{stroke:var(--paper);stroke-width:2;transition:.14s}
.pin text{font-family:var(--mono);font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none}
.pin.b-no circle{fill:#1F5347}.pin.b-yes circle{fill:#B0472F}.pin.b-unknown circle{fill:#6C7C79}
.pin:hover circle,.pin.on circle{r:11;stroke-width:2.6}
.pin:focus-visible circle{stroke:var(--gold);stroke-width:3}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:.75rem;color:var(--ink-soft)}
.maplegend b{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:5px;font-style:normal}
.mapnote{padding:0 16px 13px;font-size:.75rem;color:var(--granite)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--snow);font-size:.74rem;
  padding:4px 8px;border-radius:2px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.card.on{outline:2px solid var(--gold);outline-offset:2px}
.enq{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.enq-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.enq-state{font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:2px}
.enq-state.sent{background:var(--spruce-soft);color:var(--spruce)}
.enq-state.manual{background:var(--gold-soft);color:var(--gold)}
.enq-state.failed{background:var(--rowan-soft);color:var(--rowan)}
.enq-when{font-family:var(--mono);font-size:.72rem;color:var(--granite)}
.enq-note{font-size:.78rem;color:var(--ink-soft);margin:6px 0 0}
.enq-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.btn{font:inherit;font-size:.79rem;padding:6px 12px;border-radius:2px;cursor:pointer;
  border:1px solid var(--spruce);background:var(--spruce);color:var(--snow);transition:.14s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--spruce);text-decoration:none;display:inline-block}
.btn.ghost:hover{background:var(--spruce);color:var(--snow)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.done{background:var(--gold);border-color:var(--gold);color:#fff}
.enq pre{background:var(--snow);border:1px solid var(--line);border-radius:2px;padding:11px 13px;
  margin:9px 0 0;font-family:var(--mono);font-size:.74rem;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;max-height:230px;overflow:auto;color:var(--ink-soft)}

.enq-state.ack{background:#E7F0F7;color:#245C90}
.enq-state.avail{background:var(--spruce);color:var(--snow)}
@media (prefers-color-scheme:dark){.enq-state.ack{background:#16283A;color:#7FB6E6}}
:root[data-theme="dark"] .enq-state.ack{background:#16283A;color:#7FB6E6}
:root[data-theme="light"] .enq-state.ack{background:#E7F0F7;color:#245C90}
.reply{margin:10px 0 0;padding:10px 13px;border-left:3px solid var(--spruce);background:var(--snow);border-radius:2px}
.reply-head{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--granite);font-weight:700}
.reply blockquote{margin:5px 0 0;font-size:.86rem;color:var(--ink);font-style:italic}
.reply-contact{margin-top:6px;font-family:var(--mono);font-size:.73rem;color:var(--ink-soft);word-break:break-word}
.card.full-obj{opacity:.62}

.corr{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.corr-head{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-weight:700}
.corr ul{margin:5px 0 0;padding-left:17px}
.corr li{font-size:.79rem;color:var(--ink-soft);margin:2px 0}
.reply.checked{border-left-color:var(--rowan)}
.reply.dir{border-left-color:var(--gold)}
.backbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.backlink{font:inherit;font-size:.83rem;background:none;border:0;color:var(--spruce);cursor:pointer;padding:6px 0;font-weight:600}
.backlink:hover{text-decoration:underline}
.dsec{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin-bottom:12px}
.dsec h3{font-family:var(--serif);font-size:1.02rem;margin:0 0 10px;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 22px}
.dgrid dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--granite);font-weight:700;margin-top:8px}
.dgrid dd{margin:2px 0 0;font-size:.88rem}
.maplinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gps{font-family:var(--mono);font-size:.76rem;color:var(--granite);margin-top:10px}
.dmap{border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--snow)}
.dmap svg{display:block;width:100%;height:auto}
.dhero{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.dhero h1{font-size:clamp(1.4rem,3.6vw,2rem);margin:0}
.dsub{color:var(--ink-soft);font-size:.9rem;margin:0 0 14px}
.share{font-family:var(--mono);font-size:.72rem;color:var(--granite);word-break:break-all;margin-top:8px}

/* .links a would otherwise out-specify .btn and paint the label the same
   colour as the button's own background, leaving it unreadable. */
.links a.btn{background:var(--spruce);border-color:var(--spruce);color:var(--snow);font-weight:700}
.links a.btn:hover{background:var(--spruce);color:var(--snow);filter:brightness(1.12)}

.dmap svg{touch-action:pan-y;cursor:grab}
.dmap svg.drag{cursor:grabbing}
.zoomctl{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--line)}
.zoomctl button{font:inherit;font-size:.85rem;min-width:38px;height:34px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);border-radius:2px;cursor:pointer;line-height:1}
.zoomctl button:hover{border-color:var(--spruce);color:var(--spruce)}
.zoomctl button:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
.maphint{font-size:.72rem;color:var(--granite);padding:0 16px 11px}

/* the operator's own site — distinct from portal listings, which are grey-bordered */
.links a.own,.maplinks a.btn.own{border-color:var(--gold);color:var(--gold);background:transparent;font-weight:600}
.links a.own:hover,.maplinks a.btn.own:hover{background:var(--gold);color:var(--snow);filter:none}
.links a.own{font-size:.8rem;text-decoration:none;padding:5px 11px;border:1px solid var(--gold);border-radius:2px;transition:.14s}

.price .quoted{color:var(--spruce);font-weight:600}
.price .est{display:block;margin-top:2px;font-size:.76rem;color:var(--granite)}

.warnbox{margin:10px 0 12px;padding:10px 13px;border-left:3px solid var(--rowan);background:var(--rowan-soft);
  color:var(--rowan);font-size:.83rem;border-radius:2px;font-weight:600;line-height:1.5}

/* Leaflet, used only by builds hosted outside an Artifact. */
.map.lmap{height:min(70vh,560px);width:100%}
.lpin span{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;
  border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-popup-content{font-family:var(--sans);font-size:.86rem;line-height:1.45}
.leaflet-popup-content a{color:var(--spruce)}
.dmap .leaflet-container{border-radius:2px}

/* Photos. On an Artifact these never load — the CSP blocks the portal's
   image host — so every image hides itself on error rather than leaving a
   row of broken-image icons. */
.hero{position:relative;margin:-18px -20px 14px;aspect-ratio:16/9;overflow:hidden;background:var(--snow);
  border-radius:3px 3px 0 0}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shots{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.62);color:#fff;
  font-size:.72rem;padding:3px 9px;border-radius:2px;font-family:var(--mono)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.shot{padding:0;border:0;background:var(--snow);border-radius:2px;overflow:hidden;cursor:pointer;
  aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:.15s}
.shot:hover img{transform:scale(1.04)}
.shot:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
#lightbox{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.93);
  align-items:center;justify-content:center}
#lightbox.on{display:flex}
#lightbox img{max-width:94vw;max-height:88vh;object-fit:contain}
#lightbox button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;
  font-size:1.9rem;line-height:1;width:48px;height:48px;border-radius:50%;cursor:pointer}
.lb-close{top:16px;right:16px}
.lb-prev{left:12px}
.lb-next{right:12px}
#lightbox button:hover{background:rgba(255,255,255,.28)}
.lb-count{position:absolute;bottom:16px;color:#fff;font-family:var(--mono);font-size:.8rem;opacity:.8}
@media (max-width:560px){#lightbox button{width:40px;height:40px;font-size:1.5rem}}

/* Name and hero shot are both routes into the detail. `.links a` styling would
   otherwise repaint the heading link as a bordered button. */
.cname a{color:inherit;text-decoration:none;border:0;padding:0}
.cname a:hover{color:var(--spruce);text-decoration:underline}
.cname a:focus-visible{outline:2px solid var(--spruce);outline-offset:2px;border-radius:2px}
a.hero{display:block;text-decoration:none}
a.hero:focus-visible{outline:2px solid var(--spruce);outline-offset:-2px}

/* ---------- Přehled: mřížka objektů ---------------------------------- */
.views{display:flex;gap:8px;margin:0 0 16px}
.views .chip{font-size:.9rem;padding:7px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;
  overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.tile:hover{border-color:var(--spruce);box-shadow:0 2px 14px rgba(0,0,0,.07)}
.tile.t-out{opacity:.55}
.thumb{display:block;aspect-ratio:4/3;background:var(--snow);position:relative;overflow:hidden}
/* Scroll-snap does the swiping; the arrows below just drive the same scroller,
   so touch works without a line of JavaScript. */
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:block;height:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;
  border:0;border-radius:50%;background:rgba(255,255,255,.86);color:#22302d;cursor:pointer;
  font-size:1.15rem;line-height:1;display:grid;place-items:center;opacity:0;transition:.14s;padding:0}
.nav.prev{left:7px}
.nav.next{right:7px}
.tile:hover .nav,.nav:focus-visible{opacity:1}
.nav:hover{background:#fff}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:4px;justify-content:center;
  z-index:2;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transition:.14s}
.dots i.on{background:#fff;width:14px;border-radius:3px}
@media (hover:none){.nav{opacity:.9}}
/* Two thirds of the objects were added by hand and have no photo; a deliberate
   tile reads as a choice, a broken-image frame reads as a bug. */
.noimg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:var(--spruce-soft);color:var(--spruce);font-family:var(--serif);
  font-size:1.15rem;text-transform:lowercase;letter-spacing:.02em}
.noimg span{font-family:var(--sans);font-size:.78rem;color:var(--ink-soft);text-transform:none}
.thumb .shots{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;
  font-size:.7rem;padding:2px 8px;border-radius:2px}
.star{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;
  border:0;cursor:pointer;background:rgba(255,255,255,.9);color:#9aa8a5;font-size:1.05rem;line-height:1;
  display:grid;place-items:center;transition:.14s}
.star:hover{transform:scale(1.08)}
.star.on{background:var(--gold);color:#fff}
.tbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.tbody h3{font-family:var(--serif);font-size:1.05rem;font-weight:600;margin:0;line-height:1.25}
.tbody h3 a{color:inherit;text-decoration:none}
.tbody h3 a:hover{text-decoration:underline}
.tvill{font-size:.8rem;color:var(--ink-soft);margin:0}
.tprice{font-family:var(--mono);font-variant-numeric:tabular-nums;display:block;margin:3px 0 1px}
.tprice b{font-size:1.12rem;color:var(--ink)}
.tprice small{display:block;font-size:.72rem;color:var(--granite);font-family:var(--sans)}
.tprice.none{font-family:var(--sans);font-size:.85rem;color:var(--granite);font-style:italic}
.tfacts{font-size:.82rem;color:var(--ink);margin:0}
.tgood,.tbad{font-size:.78rem;margin:0}
.tgood{color:var(--spruce)}
.tbad{color:var(--rowan)}
.tstate{align-self:flex-start;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;background:var(--snow);color:var(--ink-soft)}
.tstate.s-avail{background:var(--spruce);color:var(--snow)}
.tstate.s-sent,.tstate.s-ack{background:var(--gold-soft);color:var(--gold)}
.tstate.s-failed{background:var(--rowan-soft);color:var(--rowan)}
.pick{margin-top:auto;padding-top:9px;font-size:.78rem;color:var(--ink-soft);
  display:flex;gap:6px;align-items:center;cursor:pointer}
.ctl-row input[type=range]{flex:1 1 180px;max-width:280px;accent-color:var(--spruce)}
.ctl-row output{font-family:var(--mono);font-size:.8rem;color:var(--ink-soft);min-width:9ch}

/* ---------- Porovnání vedle sebe ------------------------------------- */
.cmpwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
.cmp thead th{text-align:left;padding:14px 14px 12px;border-bottom:2px solid var(--line);vertical-align:top}
.cmp thead th a{font-family:var(--serif);font-size:1rem;color:var(--ink);text-decoration:none;display:block}
.cmp thead th span{display:block;font-size:.75rem;color:var(--ink-soft);font-weight:400;margin-top:2px}
.cmp tbody th{text-align:left;font-weight:600;font-size:.78rem;color:var(--ink-soft);
  padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp td{padding:9px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-variant-numeric:tabular-nums;color:var(--ink)}
.cmp td.best{background:var(--spruce-soft);color:var(--spruce);font-weight:700}
.cmp tbody tr:last-child th,.cmp tbody tr:last-child td{border-bottom:0}
.cmpnote{font-size:.78rem;color:var(--granite);margin:10px 0 0}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .views .chip{flex:1;text-align:center}
}

.gate{max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
.gate h1{font-size:1.5rem;margin:0 0 6px}
.gate p{color:var(--ink-soft);font-size:.92rem;margin:0 0 22px}
.gate form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gate input{flex:1 1 220px;font:inherit;font-size:1rem;padding:11px 13px;border:1px solid var(--line);
  border-radius:3px;background:var(--paper);color:var(--ink);min-width:0}
.gate input:focus-visible{outline:2px solid var(--spruce);outline-offset:1px}
.gate button{font:inherit;font-size:1rem;padding:11px 20px;border-radius:3px;cursor:pointer;
  border:1px solid var(--spruce);background:var(--spruce);color:var(--snow)}
.gate button[disabled]{opacity:.6;cursor:progress}
.gate .err{color:var(--rowan);font-size:.88rem;margin-top:14px;min-height:1.2em}
</style>
</head>

  <p>Stránka je zamčená. Zadej heslo, které máš od Filipa.</p>

</div>

const SALT = "3LqszLA8RzppqK1N7B+Vxw==";
const IV = "Mhp+OvfQoysys/WJ";
const ITER = 600000;
const KEY_CACHE = 'unlocked:' + location.pathname;

const bytes = (b64s) => Uint8Array.from(atob(b64s), c => c.charCodeAt(0));

async function unlock(password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // A wrong passphrase fails the GCM authentication tag, so this throws rather
  // than returning plausible-looking rubbish.
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(PAYLOAD));
  return JSON.parse(new TextDecoder().decode(plain));
}

function reveal(payload) {
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML = payload.body;
  // The page script declares top-level consts and wires up the DOM it was just
  // given, so it has to run after the markup is in place.
  new Function(payload.script)();
}

const form = document.getElementById('gateForm');
const err = document.getElementById('err');
const go = document.getElementById('go');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  go.disabled = true;
  err.textContent = 'Odemykám…';
  try {
    const payload = await unlock(pw);
    try { sessionStorage.setItem(KEY_CACHE, pw); } catch {}
    reveal(payload);
  } catch {
    go.disabled = false;
    err.textContent = 'Heslo nesedí. Zkus to znovu.';
    document.getElementById('pw').select();
  }
});

// Coming back within the same tab should not ask again.
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(KEY_CACHE); } catch {}
  if (!saved) return;
  try { reveal(await unlock(saved)); } catch {
    try { sessionStorage.removeItem(KEY_CACHE); } catch {}
  }
})();
</script>
</body>
</html>
